            | 🍏 **iOS** (Simulator) | [ZIP](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.app_version }}/Stellarium-iOS-Simulator-${{ steps.version.outputs.app_version }}.zip) |
